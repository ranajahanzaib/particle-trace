[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-trace"
version = "0.1.0"
description = "Scientific data processing pipeline for Particle Trace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rana Jahanzaib"}
]
dependencies = [
    "networkx",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
full = [
    "polars",
    "pyarrow",
    "colliderml",
    "boto3",
]

[project.scripts]
particle-trace = "particle_trace.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
