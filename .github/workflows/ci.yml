name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Install Node dependencies
        run: pnpm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e pipeline/
          pip install pytest pydantic networkx

      - name: Run Python pipeline tests
        run: PYTHONPATH=pipeline/src pytest pipeline/tests

      - name: Validate dataset fixtures
        run: PYTHONPATH=pipeline/src python3 -m particle_trace.cli validate --target-dir data/fixtures

      - name: Run Frontend & API tests
        run: pnpm test

      - name: Build Frontend
        run: pnpm build
