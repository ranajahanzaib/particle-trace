name = "particle-trace"
compatibility_date = "2024-11-01"
pages_build_output_dir = "apps/web/dist"
compatibility_flags = ["nodejs_compat"]

# Cloudflare R2 bucket binding for processed ColliderML event bundles
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "particle-trace-data"
preview_bucket_name = "particle-trace-data-preview"
